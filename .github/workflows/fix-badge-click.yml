name: Fix VantaTest badge click

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/fix-badge-click.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout VantaTest
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix click vs drag and black border
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/components/window/Openbutton.lua')
          s = p.read_text(encoding='utf-8')

          old = '''        dragging = false\n        OpenButtonMain.Dragging = false\n        activeInput = nil\n\n        if OpenButtonMain.WasDragged then\n            task.delay(0.2, function()\n                OpenButtonMain.WasDragged = false\n            end)\n        end\n    end)\n\n    Creator.AddSignal(Hitbox.Activated, function()\n        if OpenButtonMain.WasDragged or OpenButtonMain.Dragging then\n            return\n        end\n        if Window.Open then\n            Window:Open()\n        end\n    end)'''

          new = '''        local wasDragged = OpenButtonMain.WasDragged\n\n        dragging = false\n        OpenButtonMain.Dragging = false\n        activeInput = nil\n\n        if wasDragged then\n            task.delay(0.2, function()\n                OpenButtonMain.WasDragged = false\n            end)\n        else\n            OpenButtonMain.WasDragged = false\n            if Window.Open then\n                Window:Open()\n            end\n        end\n    end)'''

          assert s.count(old) == 1, f'click block mismatch: {s.count(old)}'
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          t = Path('test.lua')
          x = t.read_text(encoding='utf-8')
          old_color = '''        Color = ColorSequence.new({\n            ColorSequenceKeypoint.new(0, Color3.fromHex("#FF243A")),\n            ColorSequenceKeypoint.new(0.33, Color3.fromHex("#FFFFFF")),\n            ColorSequenceKeypoint.new(0.66, Color3.fromHex("#FFFFFF")),\n            ColorSequenceKeypoint.new(1, Color3.fromHex("#FF243A")),\n        }),'''
          new_color = '''        Color = ColorSequence.new({\n            ColorSequenceKeypoint.new(0, Color3.fromHex("#000000")),\n            ColorSequenceKeypoint.new(1, Color3.fromHex("#000000")),\n        }),'''
          assert x.count(old_color) == 1, f'border color block mismatch: {x.count(old_color)}'
          x = x.replace(old_color, new_color, 1)
          t.write_text(x, encoding='utf-8')
          PY

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/window/Openbutton.lua test.lua
          git commit -m "Fix minimized badge click and use black border"
          git pull --rebase origin main
          git push origin HEAD:main
