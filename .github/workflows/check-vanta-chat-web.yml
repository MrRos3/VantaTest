name: Test Vanta Chat Companion
on:
  push:
    branches: [main]
    paths:
      - "vanta-chat-web/**"
      - ".github/workflows/check-vanta-chat-web.yml"
  pull_request:
    paths:
      - "vanta-chat-web/**"
      - ".github/workflows/check-vanta-chat-web.yml"
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r vanta-chat-web/requirements.txt
      - run: python -m compileall -q vanta-chat-web
      - run: python -m unittest discover -s vanta-chat-web/tests -v
        env:
          SECRET_KEY: "ci-only-test-key"
          INVITE_CODE: "VANTA-CI"
      - name: Check live Render companion
        run: |
          python - <<'PY'
          import json, time, urllib.request
          base = "https://vanta-chat-lab.onrender.com"
          error = None
          for i in range(12):
              try:
                  with urllib.request.urlopen(base + "/api/health", timeout=30) as r:
                      data = json.loads(r.read().decode())
                  assert data["ok"] and "EN" in data["rooms"] and "AR" in data["rooms"]
                  error = None
                  break
              except Exception as ex:
                  error = ex
                  time.sleep(8)
          if error:
              raise RuntimeError("Live Render chat did not pass health check") from error
          for path in ("/", "/icons/social/send.svg", "/wallpaper"):
              with urllib.request.urlopen(base + path, timeout=25) as r:
                  assert r.status == 200, path
          print("Live Vanta Chat endpoints and SaltyIcons are reachable.")
          PY
