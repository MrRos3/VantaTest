name: Seed VantaTest from VantaUI

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/sync-vantaui-test.yml"

permissions:
  contents: write

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout VantaTest
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone current VantaUI
        run: git clone --depth 1 https://github.com/MrRos3/VantaUI.git /tmp/VantaUI

      - name: Mirror files into VantaTest
        run: |
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/workflows/sync-vantaui-test.yml' \
            /tmp/VantaUI/ ./

      - name: Point test URLs at VantaTest
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              "https://github.com/MrRos3/VantaUI": "https://github.com/MrRos3/VantaTest",
              "https://raw.githubusercontent.com/MrRos3/VantaUI": "https://raw.githubusercontent.com/MrRos3/VantaTest",
              "MrRos3/VantaUI": "MrRos3/VantaTest",
          }

          for path in Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              new = text
              for old, value in replacements.items():
                  new = new.replace(old, value)
              if new != text:
                  path.write_text(new, encoding='utf-8')
          PY

      - name: Commit mirrored test tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Mirror VantaUI into VantaTest"
          git push origin main
