name: Revert Vanta polish

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/revert-vanta-polish.yml"

permissions:
  contents: write

jobs:
  revert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout VantaTest
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore pre-polish VantaTest files
        run: |
          git checkout 85fb2648fe80469f702618b1c42da9cb0569b56e -- \
            dist/main.lua \
            main.lua \
            src/components/Notification.lua \
            src/components/ui/Dropdown.lua \
            src/components/window/Element.lua \
            src/components/window/Init.lua \
            src/components/window/Tab.lua \
            src/elements/Dropdown.lua \
            src/elements/Section.lua \
            src/elements/Slider.lua \
            test.lua

      - name: Commit rollback
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/main.lua main.lua src/components/Notification.lua src/components/ui/Dropdown.lua src/components/window/Element.lua src/components/window/Init.lua src/components/window/Tab.lua src/elements/Dropdown.lua src/elements/Section.lua src/elements/Slider.lua test.lua
          git commit -m "Revert Vanta visual polish pass [skip ci]"
          git push origin HEAD:main
