name: Vanta Music Bundler (retired)

# The old YouTube/Piped/Invidious downloader is intentionally retired.
# Vanta built-in music is now distributed from repository-owned base64 chunks
# and reconstructed/cached by the executor-side music player.
on:
  workflow_dispatch:

jobs:
  retired:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "Retired: Vanta music no longer depends on third-party stream APIs."
