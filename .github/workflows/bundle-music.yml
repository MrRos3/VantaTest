name: Bundle Vanta Music

on:
  push:
    paths:
      - '.github/workflows/bundle-music.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg jq

      - name: Download authorized built-in tracks
        shell: bash
        run: |
          set -euo pipefail

          UA='VantaTestMusicBundler/1.0 (+https://github.com/MrRos3/VantaTest)'
          mkdir -p assets/music/builtin /tmp/vanta_music

          # Pull the current opt-in Cobalt community list. We only prefer
          # online instances that report YouTube Music support and no auth.
          # Static fallbacks are appended because the tracker itself may be down.
          CANDIDATES_FILE=/tmp/vanta_music/cobalt-instances.txt
          : > "$CANDIDATES_FILE"

          if curl -fsSL --max-time 20 -A "$UA" \
            'https://instances.cobalt.best/instances.json' \
            -o /tmp/vanta_music/instances.json; then
            jq -r '
              .[]
              | select((.online == true) or (.online.api == true))
              | select((.services["youtube music"] == true) or (.services.youtube_music == true) or (.services.youtube == true))
              | select((.info.auth // false) == false)
              | select(.api != null and .api != "")
              | "\(.protocol // "https")://\(.api)"
            ' /tmp/vanta_music/instances.json >> "$CANDIDATES_FILE" || true
          fi

          printf '%s\n' \
            'https://cobalt-api.meowing.de' \
            'https://capi.3kh0.net' \
            'https://cobalt-backend.canine.tools' \
            'https://cobalt-api.kwiatekmiki.com' \
            >> "$CANDIDATES_FILE"

          # Keep order but remove duplicate URLs.
          awk '!seen[$0]++ && NF' "$CANDIDATES_FILE" > "$CANDIDATES_FILE.tmp"
          mv "$CANDIDATES_FILE.tmp" "$CANDIDATES_FILE"

          echo 'Cobalt candidates:'
          cat "$CANDIDATES_FILE"

          cobalt_audio() {
            local source_url="$1"
            local output_file="$2"
            local response=/tmp/vanta_music/cobalt-response.json
            local body
            body="$(jq -nc --arg url "$source_url" '{
              url: $url,
              downloadMode: "audio",
              audioFormat: "mp3",
              audioBitrate: "96",
              filenameStyle: "basic",
              alwaysProxy: true,
              localProcessing: "disabled"
            }')"

            while IFS= read -r api; do
              [ -n "$api" ] || continue
              echo "Trying $api"
              rm -f "$response" "$output_file"

              if ! curl -fsS --max-time 45 -A "$UA" \
                -H 'Accept: application/json' \
                -H 'Content-Type: application/json' \
                --data "$body" \
                "${api%/}/" \
                -o "$response"; then
                echo "  request failed"
                continue
              fi

              status="$(jq -r '.status // empty' "$response" 2>/dev/null || true)"
              media_url="$(jq -r '.url // empty' "$response" 2>/dev/null || true)"
              echo "  status: ${status:-unknown}"

              if { [ "$status" = 'tunnel' ] || [ "$status" = 'redirect' ]; } && [ -n "$media_url" ]; then
                if curl -fL --retry 2 --retry-delay 1 --max-time 360 -A "$UA" \
                  "$media_url" -o "$output_file"; then
                  if [ -s "$output_file" ] && ffprobe -v error -select_streams a:0 \
                    -show_entries stream=codec_type -of csv=p=0 "$output_file" | grep -q audio; then
                    echo "  success via $api"
                    return 0
                  fi
                fi
              fi

              if [ "$status" = 'error' ]; then
                echo "  $(jq -r '.error.code // "unknown cobalt error"' "$response" 2>/dev/null || true)"
              fi
            done < "$CANDIDATES_FILE"

            echo "No Cobalt instance could fetch $source_url" >&2
            return 1
          }

          build_track() {
            local source_url="$1"
            local video_id="$2"
            local slug="$3"
            local title="$4"
            local artist="$5"

            local downloaded="/tmp/vanta_music/${slug}.source"
            cobalt_audio "$source_url" "$downloaded"

            ffmpeg -hide_banner -loglevel error -y -i "$downloaded" \
              -map 0:a:0 -vn -ac 2 -ar 44100 \
              -c:a libmp3lame -b:a 96k \
              -metadata title="$title" \
              -metadata artist="$artist" \
              "assets/music/builtin/${slug}.mp3"

            # Covers do not need authenticated YouTube access.
            cover="assets/music/builtin/${slug}.jpg"
            if ! curl -fL --retry 2 --max-time 30 -A "$UA" \
              "https://i.ytimg.com/vi/${video_id}/maxresdefault.jpg" -o "$cover"; then
              curl -fL --retry 2 --max-time 30 -A "$UA" \
                "https://i.ytimg.com/vi/${video_id}/hqdefault.jpg" -o "$cover"
            fi

            # Normalize the cover and keep it light for executor caching.
            ffmpeg -hide_banner -loglevel error -y -i "$cover" \
              -vf 'scale=512:-2' -q:v 5 "${cover}.tmp.jpg"
            mv "${cover}.tmp.jpg" "$cover"
          }

          build_track \
            'https://music.youtube.com/watch?v=LJhYHsN3PhU' \
            'LJhYHsN3PhU' \
            'azeri-kavkaz' \
            'Azeri Kavkaz' \
            'Caucasus Dance'

          build_track \
            'https://music.youtube.com/watch?v=1loRKEs26G4' \
            '1loRKEs26G4' \
            'i-love-you-so-arabic-slowed' \
            'I Love You So (Arabic Version - Slowed)' \
            'aessy • Tom Vaulbert'

          echo 'Built-in music bundle:'
          ls -lh assets/music/builtin

      - name: Commit music bundle
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/music/builtin
          if git diff --cached --quiet; then
            echo 'Music bundle already up to date.'
            exit 0
          fi
          git commit -m 'Bundle built-in Vanta music [skip ci]'
          git push
