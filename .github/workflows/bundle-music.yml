name: Bundle Vanta Music

on:
  push:
    paths:
      - '.github/workflows/bundle-music.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg jq

      - name: Download authorized built-in tracks
        shell: bash
        run: |
          set -euo pipefail

          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 VantaTestMusicBundler/1.0'
          mkdir -p assets/music/builtin /tmp/vanta_music

          cat > /tmp/vanta_music/invidious-instances.txt <<'EOF'
          https://inv.nadeko.net
          https://invidious.nerdvpn.de
          https://yt.chocolatemoo53.com
          https://invidious.tiekoetter.com
          https://invidious.f5.si
          EOF
          sed -i 's/^ *//' /tmp/vanta_music/invidious-instances.txt

          invidious_audio() {
            local video_id="$1"
            local output_file="$2"
            local response=/tmp/vanta_music/invidious-response.json
            local http_code media_url

            while IFS= read -r api; do
              [ -n "$api" ] || continue
              echo "==> Trying $api"
              rm -f "$response" "$output_file"

              http_code="$(curl -sS -L --max-time 60 -A "$UA" \
                -H 'Accept: application/json' \
                -o "$response" \
                -w '%{http_code}' \
                "${api%/}/api/v1/videos/${video_id}" || true)"

              echo "    HTTP ${http_code:-curl-error}"
              case "$http_code" in
                2??) ;;
                *)
                  [ -s "$response" ] && head -c 500 "$response" | sed 's/^/      /'
                  echo
                  continue
                  ;;
              esac

              if ! jq -e '.adaptiveFormats | type == "array" and length > 0' "$response" >/dev/null 2>&1; then
                echo '    No adaptiveFormats in response'
                head -c 700 "$response" | sed 's/^/      /'
                echo
                continue
              fi

              media_url="$(jq -r '
                [.adaptiveFormats[]
                  | select((.type // "") | startswith("audio/"))
                  | select(.url != null and .url != "")]
                | sort_by((.bitrate // 0))
                | reverse
                | .[0].url // empty
              ' "$response")"

              [ -n "$media_url" ] || {
                echo '    No usable audio-only URL'
                continue
              }

              echo '    Found audio stream; downloading…'
              if curl -fL --retry 2 --retry-delay 1 --max-time 360 -A "$UA" \
                -H "Referer: ${api%/}/" \
                "$media_url" -o "$output_file"; then
                if [ -s "$output_file" ] && ffprobe -v error -select_streams a:0 \
                  -show_entries stream=codec_type -of csv=p=0 "$output_file" | grep -q audio; then
                  echo "    Success via $api"
                  return 0
                fi
              fi
            done < /tmp/vanta_music/invidious-instances.txt

            echo "No Invidious instance could fetch video ${video_id}" >&2
            return 1
          }

          build_track() {
            local video_id="$1"
            local slug="$2"
            local title="$3"
            local artist="$4"
            local downloaded="/tmp/vanta_music/${slug}.source"
            local cover="assets/music/builtin/${slug}.jpg"

            invidious_audio "$video_id" "$downloaded"

            # Small but still listenable for executor-side caching.
            ffmpeg -hide_banner -loglevel error -y -i "$downloaded" \
              -map 0:a:0 -vn -ac 1 -ar 24000 \
              -c:a libopus -b:a 24k -vbr on -compression_level 10 \
              -metadata title="$title" \
              -metadata artist="$artist" \
              "assets/music/builtin/${slug}.ogg"

            if ! curl -fL --retry 2 --max-time 30 -A "$UA" \
              "https://i.ytimg.com/vi/${video_id}/maxresdefault.jpg" -o "$cover"; then
              curl -fL --retry 2 --max-time 30 -A "$UA" \
                "https://i.ytimg.com/vi/${video_id}/hqdefault.jpg" -o "$cover"
            fi

            ffmpeg -hide_banner -loglevel error -y -i "$cover" \
              -vf 'scale=512:-2' -q:v 5 "${cover}.tmp.jpg"
            mv "${cover}.tmp.jpg" "$cover"
          }

          build_track \
            'LJhYHsN3PhU' \
            'azeri-kavkaz' \
            'Azeri Kavkaz' \
            'Caucasus Dance'

          build_track \
            '1loRKEs26G4' \
            'i-love-you-so-arabic-slowed' \
            'I Love You So (Arabic Version - Slowed)' \
            'aessy • Tom Vaulbert'

          echo 'Built-in music bundle:'
          ls -lh assets/music/builtin

      - name: Commit music bundle
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/music/builtin
          if git diff --cached --quiet; then
            echo 'Music bundle already up to date.'
            exit 0
          fi
          git commit -m 'Bundle built-in Vanta music [skip ci]'
          git push
