name: Check VantaTest window minimize

on:
  push:
    branches: [main]
    paths:
      - "main.lua"
      - "example.lua"
      - "src/components/window/Element.lua"
      - "src/components/Notification.lua"
      - "src/elements/Slider.lua"
      - "src/components/window/Init.lua"
      - "src/components/window/Tab.lua"
      - "src/components/ui/Toggle.lua"
      - "src/components/ui/Button.lua"
      - ".github/workflows/check-window-minimize.yml"
  pull_request:
    paths:
      - "main.lua"
      - "example.lua"
      - "src/components/window/Element.lua"
      - "src/components/Notification.lua"
      - "src/elements/Slider.lua"
      - "src/components/window/Init.lua"
      - "src/components/window/Tab.lua"
      - "src/components/ui/Toggle.lua"
      - "src/components/ui/Button.lua"
      - ".github/workflows/check-window-minimize.yml"

permissions:
  contents: read

jobs:
  minimize-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leafo/gh-actions-lua@v11
        with:
          luaVersion: "5.1"
      - name: Verify loader and demo Lua syntax
        run: |
          luac -p main.lua
          luac -p example.lua
          luac -p tests/200Elements.lua
          luac -p tests/ProgressBar.lua
          luac -p tests/nameplate_mock.lua
      - name: Verify instant particle cleanup and removed chat
        run: |
          python3 - <<'PY'
          from pathlib import Path

          main = Path('main.lua').read_text()
          example = Path('example.lua').read_text()
          assert 'function window:Close(...)' in main
          # The premium scale wrapper also has a Close method. Inspect the
          # original particle-hiding wrapper specifically, not the first Close.
          assert 'local closeOriginal = window.Close' in main
          close_body = main.split('local closeOriginal = window.Close',1)[1].split('function window:Close(...)',1)[1].split('end',1)[0]
          assert close_body.index('ambient.Visible = false') < close_body.index('closeOriginal(self, ...)')
          assert 'overlay.Visible = not window.Closed and main.Visible' in main
          assert 'if window.Closed or not main.Visible or settings.ReduceMotion or window._VantaLowFPS or settings.Density<=0 then' in main
          assert 'overlay.Visible = false' in main
          assert 'CrimsonBreath' in main and 'BreathingMask' in main
          assert 'local streak=elapsed%19' in main
          assert 'VisualDefaults.ReduceMotion=value==true' in main
          assert 'window._VantaPremium:Refresh()' in main
          assert 'PremiumSweeps' in main
          assert 'overlay.Visible = true' in main
          assert 'RunService.RenderStepped:Connect' in main
          assert 'CRIMSON_AMBIENT_FPS = 30' in main
          assert 'Petal = 18' in main and 'Ember = 17' in main
          assert 'Mote = 10' in main and 'Glint = 5' in main
          assert 'local function spawn(kind, index)' in main
          assert "for _, kind in ipairs({ \"Petal\", \"Ember\", \"Mote\", \"Glint\" }) do" in main
          assert 'frameAccumulator = 0' in main
          assert 'elapsed = elapsed + frameAccumulator' in main
          assert 'if window.Destroyed or not overlay.Parent then' in main
          assert 'connection:Disconnect()' in main
          assert "if overlay.Parent then overlay:Destroy() end" in main
          assert 'overlay.ClipsDescendants = true' in main
          assert 'overlay.Active = false' in main
          assert 'p.item.BackgroundTransparency = math.clamp' in main
          assert 'local function attachPremiumWindow(window,theme)' in main
          assert 'VantaUI.Creator.NewRoundFrame(window.UICorner,"Squircle-Outline"' in main
          assert 'PremiumWindowOutline' in main
          assert 'Parent=root,ZIndex=98' in main
          assert 'ImageTransparency=0.03,Active=false' in main
          assert 'PremiumWindowEdge' not in main
          assert 'PremiumRoundWindow' not in main
          assert 'PremiumHalo' not in main
          assert 'haloRotationTween' not in main
          assert 'PremiumTopbarGlass' in main
          assert 'PremiumTitleShine' in main
          assert 'premiumTitleGradient(themeAccent(theme))' in main
          assert 'Color3.fromRGB(255,255,255)' in main
          assert 'PremiumTitleOutline' in main
          assert 'Color3.fromRGB(26,0,8),Thickness=1' in main
          assert 'PremiumSidebarScrim' in main
          assert 'NumberSequenceKeypoint.new(0.00,0.25)' in main
          assert 'NumberSequenceKeypoint.new(1.00,1.00)' in main
          assert 'PremiumWallpaperClip' in main
          assert 'ClipsDescendants=true' in main
          assert 'PremiumVignetteCorner' in main
          assert 'PremiumScrimCorner' in main
          assert 'CornerRadius=UDim.new(0,window.UICorner)' in main
          assert 'PremiumEdgeMotion' in main
          assert 'rotationTween:Cancel()' in main
          assert 'edge.ImageTransparency=0.03+0.12*(1-settings.Intensity)' in main
          assert 'TweenInfo.new(4,Enum.EasingStyle.Linear' in main
          assert 'PremiumTopbarDivider' not in main
          assert 'PremiumDividerGradient' not in main
          assert 'PremiumOuterAura' in main
          assert 'PremiumAuraSoftness' in main
          assert 'PremiumCrimsonGrade' in main
          assert 'PremiumGradeFalloff' in main
          assert 'ambientLight.BackgroundTransparency=0.89-0.115*settings.Intensity' in main
          assert 'TabBackgroundActiveTransparency = 0.05' in main
          assert 'ElementBackgroundTransparency = 0.06' in main
          window_src = Path('src/components/window/Init.lua').read_text()
          assert 'rbxassetid://120997033468887' not in window_src
          assert 'Visible = false, -- permanently hide the old gray resize arc' in window_src
          tabs = Path('src/components/window/Tab.lua').read_text()
          assert 'PremiumMovingPill' in tabs
          assert 'PremiumActiveCrimson' in tabs
          assert 'TabModule.SelectedTab==TabIndex' in tabs
          assert 'ImageColor3 = "Text"' in tabs
          toggle = Path('src/components/ui/Toggle.lua').read_text()
          assert 'PremiumTrackAura' in toggle and 'PremiumKnobAura' in toggle
          button = Path('src/components/ui/Button.lua').read_text()
          assert 'PremiumButtonGlass' in button
          assert 'Scale=0.97' in button
          assert 'PremiumCardGlass' in Path('src/components/window/Element.lua').read_text()
          assert 'PremiumRoundThumbGlow' in Path('src/elements/Slider.lua').read_text()
          assert 'PremiumCountdownGradient' in Path('src/components/Notification.lua').read_text()
          element = Path('src/components/window/Element.lua').read_text()
          notification = Path('src/components/Notification.lua').read_text()
          slider = Path('src/elements/Slider.lua').read_text()
          assert 'PremiumCardEdge' not in element
          assert 'PremiumNotificationEdge' not in notification
          assert 'PremiumEdgeGradient' not in notification
          assert 'PremiumThumbAura' not in slider
          assert 'HoverOutline' in element and 'HoverGradient' in element
          assert 'PremiumIconScale' in notification
          assert 'PremiumCountdownGradient' in notification
          assert 'PremiumSliderGradient' in slider
          tab = Path('src/components/window/Tab.lua').read_text()
          fallbacks = Path('src/themes/Fallbacks.lua').read_text()
          assert 'TextColor3 = "TabTitleActive"' in tab
          assert 'TextColor3 = "TabTitle"' in tab
          assert 'TabTitleActive = "Text"' in fallbacks
          assert 'PremiumSweeps' in main
          assert 'Vanta Void' in main
          assert 'VantaTest:SetReduceMotion(v)' in example
          assert 'VantaTest:SetParticleDensity(v/100)' in example

          assert 'ChatTab' not in example
          assert 'Vanta Chat' not in example
          assert 'roblox-chat/' not in example
          for item in ('chat.lua','chat.project.json','roblox-chat','vanta-chat-web',
                       'assets/salty-chat','docs/roblox-chat-setup.md',
                       'docs/pulse-chat-ui-findings.md','tests/test_chat.py',
                       'tests/chat_mock.lua'):
              assert not Path(item).exists(), f'Unexpected chat code: {item}'
          print('No chat features remain in VantaTest; ambient hides on minimize.')
          PY
