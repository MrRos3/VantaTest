name: Sync VantaTest with VantaUI

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/sync-vantaui-exact.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout VantaTest
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Mirror VantaUI except workflow files
        run: |
          git show HEAD:.github/workflows/build-gui.yml > /tmp/build-gui.yml
          git show HEAD:.github/workflows/sync-vantaui-exact.yml > /tmp/sync-vantaui-exact.yml

          git fetch --no-tags https://github.com/MrRos3/VantaUI.git main
          git read-tree --reset -u FETCH_HEAD

          mkdir -p .github/workflows
          cp /tmp/build-gui.yml .github/workflows/build-gui.yml
          cp /tmp/sync-vantaui-exact.yml .github/workflows/sync-vantaui-exact.yml
          git add .github/workflows/build-gui.yml .github/workflows/sync-vantaui-exact.yml

          if git diff --cached --quiet; then
            echo "Non-workflow files already match VantaUI."
            exit 0
          fi

          git commit -m "Sync VantaTest content with VantaUI [skip ci]"
          git push origin HEAD:main
