name: Fix VantaTest OpenButton crash

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/fix-openbutton-crash.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout VantaTest
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove invalid UIListLayout property writes
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/components/window/Openbutton.lua')
          s = p.read_text(encoding='utf-8')
          bad_false = '            Button.TextButton.UIListLayout.Enabled = false\n'
          bad_true = '            Button.TextButton.UIListLayout.Enabled = true\n'
          assert s.count(bad_false) == 1, f'expected one false write, got {s.count(bad_false)}'
          assert s.count(bad_true) == 1, f'expected one true write, got {s.count(bad_true)}'
          s = s.replace(bad_false, '', 1).replace(bad_true, '', 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/window/Openbutton.lua
          git commit -m "Fix OpenButton icon-only initialization crash"
          git pull --rebase origin main
          git push origin HEAD:main
