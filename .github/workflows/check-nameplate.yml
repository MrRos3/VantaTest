name: Check VantaTest Nameplate

on:
  push:
    branches: [main]
    paths:
      - "nameplate.lua"
      - "nameplate_standalone.lua"
      - "example.lua"
      - "tests/nameplate_mock.lua"
      - ".github/workflows/check-nameplate.yml"
  pull_request:
    paths:
      - "nameplate.lua"
      - "nameplate_standalone.lua"
      - "example.lua"
      - "tests/nameplate_mock.lua"
      - ".github/workflows/check-nameplate.yml"

permissions:
  contents: read

jobs:
  nameplate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leafo/gh-actions-lua@v11
        with:
          luaVersion: "5.1"
      - name: Validate Lua syntax
        run: |
          luac -p nameplate.lua
          luac -p nameplate_standalone.lua
          luac -p example.lua
          luac -p tests/nameplate_mock.lua
      - name: Exercise local-only nameplate lifecycle
        run: lua tests/nameplate_mock.lua
      - name: Verify native icon, respawn-safe lifecycle, and no external art
        run: |
          python3 - <<'PY'
          from pathlib import Path
          n=Path("nameplate.lua").read_text()
          standalone=Path("nameplate_standalone.lua").read_text()
          assert standalone.endswith("return module.new()\n")
          assert "rbxassetid://" not in standalone
          source=Path("example.lua").read_text()
          assert 'GetUserThumbnailAsync' in n
          assert 'game:GetService("TweenService")' in n
          assert 'TweenInfo.new(4,' in n
          assert 'bind(LocalPlayer)' in n
          assert 'Players.PlayerAdded:Connect(bind)' not in n
          assert 'Players.PlayerRemoving:Connect(unbind)' not in n
          assert 'for _,p in ipairs(Players:GetPlayers())' not in n
          assert 'p.CharacterAdded:Connect' in n
          assert 'p.CharacterRemoving:Connect' in n
          assert 'if p ~= nil and p ~= LocalPlayer then return nil end' in n
          assert 'Width = 230, Height = 72' in n
          assert 'BarInset = 10, BarHeight = 3, BarBottomInset = 3' in n
          assert 'BarTrack = Color3.fromRGB(42,10,18)' in n
          assert 'round(hpBackground,2)' in n
          assert 'round(hpFill,2)' in n
          assert 'Position=UDim2.new(1,0,1,-10)' in n
          assert 'round(tag,3)' in n
          assert 'TextTruncate=Enum.TextTruncate.AtEnd' in n
          assert 'local scripts=LocalPlayer:WaitForChild("PlayerScripts")' in n
          assert 'local lifecycle=make("Folder",{Name=ROOT},scripts)' in n
          assert 'record.player.Character~=character' in n
          assert 'record.serial~=version' in n
          assert 'config.LoadRemoteImage' not in n
          assert 'HttpGet' not in n and 'FireServer' not in n
          assert 'rbxassetid://' not in n
          assert 'NameplateVisibilitySlot' in source
          assert 'NameplateVisibilityButton' in source
          assert 'Name = "NativeEye"' in source
          assert 'Name = "EyePupil"' in source
          assert 'Name = "HiddenSlash"' in source
          assert 'ImageLabel' not in source.split('local rightOk, rightError = pcall(function()',1)[1].split('end)',1)[0]
          assert 'nameplateToggle:Set(nameplateVisible, false, true)' in source
          assert 'slot.LayoutOrder = 996' in source
          assert 'ChatTab' not in source and 'Vanta Chat' not in source
          print("Local-only nameplate geometry, eye control and respawn-safe lifecycle verified.")
          PY
