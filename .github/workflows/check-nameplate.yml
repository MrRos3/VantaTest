name: Check Vanta Owl nameplate

on:
  push:
    branches: [main]
    paths:
      - "nameplate.lua"
      - "nameplate_standalone.lua"
      - "example.lua"
      - "assets/owl/vanta_owl_96.png"
      - "tests/nameplate_mock.lua"
      - ".github/workflows/check-nameplate.yml"
  pull_request:
    paths:
      - "nameplate.lua"
      - "nameplate_standalone.lua"
      - "example.lua"
      - "assets/owl/vanta_owl_96.png"
      - "tests/nameplate_mock.lua"
      - ".github/workflows/check-nameplate.yml"

permissions:
  contents: read

jobs:
  owl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leafo/gh-actions-lua@v11
        with:
          luaVersion: "5.1"
      - name: Check Lua syntax
        run: |
          luac -p nameplate.lua
          luac -p nameplate_standalone.lua
          luac -p example.lua
          luac -p tests/nameplate_mock.lua
      - name: Test local-only Owl GUI and respawn
        run: lua tests/nameplate_mock.lua
      - name: Verify owl art and loader wiring
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import struct
          owl = Path("assets/owl/vanta_owl_96.png").read_bytes()
          assert owl[:8] == b"\x89PNG\r\n\x1a\n"
          assert struct.unpack(">II", owl[16:24]) == (96,96)
          script = Path("nameplate.lua").read_text()
          standalone = Path("nameplate_standalone.lua").read_text()
          showcase = Path("example.lua").read_text()
          assert 'OWL_SOURCE = "https://raw.githubusercontent.com/MrRos3/VantaTest/main/assets/owl/vanta_owl_96.png"' in script
          assert 'getcustomasset' in script and 'getsynasset' in script
          assert 'writefile' in script and 'game:HttpGet' in script
          assert 'Players:GetPlayers()' in script # old overlay removal only
          assert 'listen(LocalPlayer.CharacterAdded,startCharacter)' in script
          assert 'listen(LocalPlayer.CharacterRemoving' in script
          assert 'listen(Players.PlayerAdded' not in script
          assert 'if p and p~=LocalPlayer then return nil end' in script
          assert 'LeftOwl' in script and 'RightOwl' in script
          assert '🦉' in script
          assert 'NAME_FONT = Enum.Font.Michroma' in script
          assert 'NAME_SIZE = 14' in script
          assert 'MIN_WIDTH = 150' in script
          assert 'NAME_EXTRA_PADDING = 56' in script
          assert 'POINT_DIVISOR = 1.4142' in script
          assert 'Name="OutlineLayer"' in script and 'Name="FillLayer"' in script
          for component in ('OutlineCenter','OutlineLeftPoint','OutlineRightPoint',
                            'CenterFill','LeftFillPoint','RightFillPoint'):
              assert 'Name="'+component+'"' in script
          assert 'Position=UDim2.fromOffset(half,half)' in script
          assert 'CONFIG.HEIGHT/2+contentWidth' in script
          assert 'contentWidth+CONFIG.HEIGHT' in script
          assert 'getWidth(name,bounds and bounds.X)' in script
          assert 'TextBounds' in script
          assert 'Color3.fromRGB(255,26,61)' in script
          assert 'Color3.fromRGB(255,106,131)' in script
          assert 'Color3.fromRGB(20,8,12)' in script
          assert 'Color3.fromRGB(5,5,6)' in script
          assert 'Color3.fromRGB(11,7,9)' in script
          assert 'Rotation=45' in script
          assert 'Rotation=90' in script
          assert 'borderTweens[#borderTweens+1]=pulse' in script
          assert 'for _,pulse in ipairs(borderTweens) do pulse:Cancel() end' in script
          assert 'TweenInfo.new(1.6,Enum.EasingStyle.Sine' in script
          for obsolete_plate in ('CrimsonBorderStroke', 'RotatingCrimsonBorder', 
                                  'BORDER_DARK','BORDER_PULSE_SECONDS = 4',
                                  'SoftGlow','InnerGlow','glowStroke','rounded(plate',
                                  'damageDuration','healthEvent','flicker='):
              assert obsolete_plate not in script, obsolete_plate
          assert 'NAME_SHINE_SECONDS = 1.4' in script
          assert 'NAME_SHINE_PAUSE = 2.5' in script
          assert 'ColorSequenceKeypoint.new(0.00,Color3.fromRGB(255,26,61))' in script
          assert 'ColorSequenceKeypoint.new(0.35,Color3.fromRGB(255,26,61))' in script
          assert 'ColorSequenceKeypoint.new(0.50,Color3.fromRGB(255,255,255))' in script
          assert 'ColorSequenceKeypoint.new(0.65,Color3.fromRGB(255,26,61))' in script
          assert 'ColorSequenceKeypoint.new(1.00,Color3.fromRGB(255,26,61))' in script
          assert 'TextColor3=Color3.fromRGB(255,255,255)' in script
          assert 'Color3.fromRGB(26,0,8),1,0.3' in script
          assert 'NameOutlineStroke' in script
          assert 'Offset=Vector2.new(-1,0),Rotation=0' in script
          assert 'nameGradient.Offset=Vector2.new(-1,0)' in script
          assert 'Enum.EasingStyle.Sine' in script
          assert 'Enum.EasingDirection.InOut' in script
          assert 'stopNameShine()' in script
          assert 'nameShineTween:Cancel()' in script
          assert 'listen(Players.PlayerRemoving,function(p)' in script
          assert 'if p==LocalPlayer then controller:Destroy() end' in script
          for removed in ('NameShineOverlay', 'ShineMask', 'NamePulseStroke',
                          'NAME_PULSE', 'NAME_GLITCH', 'glitchClock', 'WHITE_FLASH',
                          'namePulseTween', 'nameGradient.Color='):
              assert removed not in script, 'Obsolete name effect: ' + removed
          assert standalone.endswith("return module.new()\n")
          assert 'TagChip' not in script and 'HealthFill' not in script
          assert 'NameplateVisibilityButton' in showcase
          assert 'nameplateToggle:Set(nameplateVisible, false, true)' in showcase
          assert '"SetSubtitle"' not in showcase and '"SetTag"' not in showcase
          assert 'Vanta Chat' not in showcase
          print("Vanta Owl repo image, centered self-only GUI, native fallback and respawn behavior verified.")
          PY
