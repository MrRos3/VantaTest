name: Check Vanta Owl nameplate

on:
  push:
    branches: [main]
    paths:
      - "nameplate.lua"
      - "nameplate_standalone.lua"
      - "example.lua"
      - "assets/owl/vanta_owl_96.png"
      - "tests/nameplate_mock.lua"
      - ".github/workflows/check-nameplate.yml"
  pull_request:
    paths:
      - "nameplate.lua"
      - "nameplate_standalone.lua"
      - "example.lua"
      - "assets/owl/vanta_owl_96.png"
      - "tests/nameplate_mock.lua"
      - ".github/workflows/check-nameplate.yml"

permissions:
  contents: read

jobs:
  owl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leafo/gh-actions-lua@v11
        with:
          luaVersion: "5.1"
      - name: Check Lua syntax
        run: |
          luac -p nameplate.lua
          luac -p nameplate_standalone.lua
          luac -p example.lua
          luac -p tests/nameplate_mock.lua
      - name: Test local-only Owl GUI and respawn
        run: lua tests/nameplate_mock.lua
      - name: Verify owl art and loader wiring
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import struct
          owl = Path("assets/owl/vanta_owl_96.png").read_bytes()
          assert owl[:8] == b"\x89PNG\r\n\x1a\n"
          assert struct.unpack(">II", owl[16:24]) == (96,96)
          script = Path("nameplate.lua").read_text()
          standalone = Path("nameplate_standalone.lua").read_text()
          showcase = Path("example.lua").read_text()
          assert 'OWL_SOURCE = "https://raw.githubusercontent.com/MrRos3/VantaTest/main/assets/owl/vanta_owl_96.png"' in script
          assert 'getcustomasset' in script and 'getsynasset' in script
          assert 'writefile' in script and 'game:HttpGet' in script
          assert 'Players:GetPlayers()' in script # old overlay removal only
          assert 'listen(LocalPlayer.CharacterAdded,startCharacter)' in script
          assert 'listen(LocalPlayer.CharacterRemoving' in script
          assert 'listen(Players.PlayerAdded' not in script
          assert 'if p and p~=LocalPlayer then return nil end' in script
          assert 'LeftOwl' in script and 'RightOwl' in script
          assert '🦉' in script
          assert 'TagChip' not in script and 'HealthFill' not in script
          assert standalone.endswith("return module.new()\n")
          assert 'NameplateVisibilityButton' in showcase
          assert 'nameplateToggle:Set(nameplateVisible, false, true)' in showcase
          assert '"SetSubtitle"' not in showcase and '"SetTag"' not in showcase
          assert 'Vanta Chat' not in showcase
          print("Vanta Owl repo image, centered self-only GUI, native fallback and respawn behavior verified.")
          PY
