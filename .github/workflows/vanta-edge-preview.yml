name: Vanta Edge preview

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/vanta-edge-preview.yml"

permissions:
  contents: write

jobs:
  edge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout VantaTest
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Vanta Edge
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("tools/vanta_edge.py")
          s = p.read_text(encoding="utf-8")
          start = s.index("# Vanta Edge: topbar divider")
          end = s.index("# Vanta Edge: button press depth")
          replacement = '''# Vanta Edge: topbar divider
# ---------------------------------------------------------
path = "src/components/window/Init.lua"
text = load(path)
text = once(
    text,
    '\\t\\t\\t\\tNew("Frame", { -- Topbar Left Side',
    ''' + "'''" + '''\\t\\t\\t\\tNew("Frame", {
\\t\\t\\t\\t\\tName = "VantaEdgeDivider",
\\t\\t\\t\\t\\tSize = UDim2.new(1, 0, 0, 1),
\\t\\t\\t\\t\\tPosition = UDim2.new(0, 0, 1, 0),
\\t\\t\\t\\t\\tAnchorPoint = Vector2.new(0, 1),
\\t\\t\\t\\t\\tBorderSizePixel = 0,
\\t\\t\\t\\t\\tBackgroundTransparency = 0.66,
\\t\\t\\t\\t\\tThemeTag = {
\\t\\t\\t\\t\\t\\tBackgroundColor3 = "Primary",
\\t\\t\\t\\t\\t},
\\t\\t\\t\\t\\tZIndex = 5,
\\t\\t\\t\\t}, {
\\t\\t\\t\\t\\tNew("UIGradient", {
\\t\\t\\t\\t\\t\\tRotation = 0,
\\t\\t\\t\\t\\t\\tTransparency = NumberSequence.new({
\\t\\t\\t\\t\\t\\t\\tNumberSequenceKeypoint.new(0, 0.42),
\\t\\t\\t\\t\\t\\t\\tNumberSequenceKeypoint.new(0.22, 0.68),
\\t\\t\\t\\t\\t\\t\\tNumberSequenceKeypoint.new(0.62, 0.93),
\\t\\t\\t\\t\\t\\t\\tNumberSequenceKeypoint.new(1, 1),
\\t\\t\\t\\t\\t\\t}),
\\t\\t\\t\\t\\t}),
\\t\\t\\t\\t}),
\\t\\t\\t\\tNew("Frame", { -- Topbar Left Side''' + "'''" + ''',
    "topbar divider",
)
save(path, text)


# ---------------------------------------------------------
'''
          p.write_text(s[:start] + replacement + s[end:], encoding="utf-8")
          PY
          python3 tools/vanta_edge.py

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Setup Lua
        uses: leafo/gh-actions-lua@v11
        with:
          luaVersion: "5.1"

      - name: Setup Aftman
        uses: ok-nick/setup-aftman@v0.3.0

      - name: Install build tools
        run: aftman install

      - name: Build Vanta Edge runtime
        run: npm run build

      - name: Commit Vanta Edge preview
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git restore package-lock.json 2>/dev/null || true
          git add src/components/window/Init.lua src/components/ui/Button.lua src/components/window/Tab.lua src/elements/Slider.lua src/components/ui/Dropdown.lua test.lua dist/main.lua build/package.lua
          git commit -m "Add Vanta Edge motion and intro [skip ci]"
          git push origin HEAD:main
