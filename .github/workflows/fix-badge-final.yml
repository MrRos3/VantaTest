name: Fix VantaTest minimized badge

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/fix-badge-final.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout VantaTest
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix full-bleed badge and direct dragging
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/components/window/Openbutton.lua')
          s = p.read_text(encoding='utf-8')

          # Track icon-only mode so SetIcon can parent the image correctly.
          old = '''        WasDragged = false,\n    }'''
          new = '''        WasDragged = false,\n        OnlyIcon = false,\n    }'''
          assert s.count(old) == 1
          s = s.replace(old, new, 1)

          # Parent recreated icons directly to the badge in icon-only mode.
          old = '''            Icon.Size = UDim2.new(0, 22, 0, 22)\n            Icon.LayoutOrder = -1\n            Icon.Parent = OpenButtonMain.Button.TextButton'''
          new = '''            Icon.Size = UDim2.new(0, 22, 0, 22)\n            Icon.LayoutOrder = -1\n            Icon.Parent = OpenButtonMain.OnlyIcon and OpenButtonMain.Button or OpenButtonMain.Button.TextButton'''
          assert s.count(old) == 1
          s = s.replace(old, new, 1)

          # Replace generic Creator.Drag with direct input tracking for this floating badge.
          start = s.index('    -- A transparent full-size hitbox owns both drag and click')
          end = s.index('\n    function OpenButtonMain:Visible', start)
          replacement = '''    -- Dedicated badge dragging. The full transparent hitbox owns every pixel\n    -- and follows the pointer directly on both mouse and touch.\n    local dragEnabled = true\n    local dragging = false\n    local dragStart\n    local dragStartPosition\n    local activeInput\n\n    Creator.AddSignal(Hitbox.InputBegan, function(input)\n        if not dragEnabled or dragging then\n            return\n        end\n        if input.UserInputType == Enum.UserInputType.MouseButton1\n            or input.UserInputType == Enum.UserInputType.Touch then\n            dragging = true\n            OpenButtonMain.Dragging = true\n            OpenButtonMain.WasDragged = false\n            activeInput = input\n            dragStart = input.Position\n            dragStartPosition = Container.Position\n        end\n    end)\n\n    Creator.AddSignal(UserInputService.InputChanged, function(input)\n        if not dragging or not dragEnabled or not activeInput then\n            return\n        end\n\n        local valid = false\n        if activeInput.UserInputType == Enum.UserInputType.MouseButton1 then\n            valid = input.UserInputType == Enum.UserInputType.MouseMovement\n        elseif activeInput.UserInputType == Enum.UserInputType.Touch then\n            valid = input == activeInput\n        end\n        if not valid then\n            return\n        end\n\n        local delta = input.Position - dragStart\n        if math.abs(delta.X) > 2 or math.abs(delta.Y) > 2 then\n            OpenButtonMain.WasDragged = true\n        end\n        Container.Position = UDim2.new(\n            dragStartPosition.X.Scale,\n            dragStartPosition.X.Offset + delta.X,\n            dragStartPosition.Y.Scale,\n            dragStartPosition.Y.Offset + delta.Y\n        )\n    end)\n\n    Creator.AddSignal(UserInputService.InputEnded, function(input)\n        if not dragging or not activeInput then\n            return\n        end\n        local ended = input == activeInput\n            or (activeInput.UserInputType == Enum.UserInputType.MouseButton1\n                and input.UserInputType == Enum.UserInputType.MouseButton1)\n        if not ended then\n            return\n        end\n\n        dragging = false\n        OpenButtonMain.Dragging = false\n        activeInput = nil\n\n        if OpenButtonMain.WasDragged then\n            task.delay(0.18, function()\n                OpenButtonMain.WasDragged = false\n            end)\n        end\n    end)\n\n    Creator.AddSignal(Hitbox.MouseButton1Click, function()\n        if OpenButtonMain.WasDragged or OpenButtonMain.Dragging then\n            return\n        end\n        if Window.Open then\n            Window:Open()\n        end\n    end)\n\n    local DragModule = {}\n    function DragModule:Set(v)\n        dragEnabled = v ~= false\n        if not dragEnabled then\n            dragging = false\n            OpenButtonMain.Dragging = false\n            activeInput = nil\n        end\n    end\n'''
          s = s[:start] + replacement + s[end:]

          # Persist mode before any SetIcon calls and detach full-bleed image from UIListLayout.
          old = '''        local dragEnabled = OpenButtonModule.Draggable ~= false\n        if Drag and Divider then'''
          new = '''        OpenButtonMain.OnlyIcon = OpenButtonModule.OnlyIcon == true\n\n        local dragEnabled = OpenButtonModule.Draggable ~= false\n        if Drag and Divider then'''
          assert s.count(old) == 1
          s = s.replace(old, new, 1)

          old = '''            Button.TextButton.AutomaticSize = Enum.AutomaticSize.None\n            Button.TextButton.Size = UDim2.fromScale(1, 1)\n            Button.TextButton.UIPadding.PaddingLeft = UDim.new(0, 0)\n            Button.TextButton.UIPadding.PaddingRight = UDim.new(0, 0)\n\n            if Icon then\n                Icon.Size = UDim2.fromScale(1, 1)\n                Icon.Position = UDim2.fromScale(0.5, 0.5)\n                Icon.AnchorPoint = Vector2.new(0.5, 0.5)'''
          new = '''            Button.TextButton.Visible = false\n            Button.TextButton.Active = false\n\n            if Icon then\n                Icon.Parent = Button\n                Icon.Size = UDim2.fromScale(1, 1)\n                Icon.Position = UDim2.fromScale(0.5, 0.5)\n                Icon.AnchorPoint = Vector2.new(0.5, 0.5)\n                Icon.ZIndex = 100\n                if Icon.ImageLabel then\n                    Icon.ImageLabel.ZIndex = 100\n                end'''
          assert s.count(old) == 1
          s = s.replace(old, new, 1)

          # The replacement above adds an extra nested if; normalize the resulting block.
          s = s.replace('''                if Icon.ImageLabel then\n                    Icon.ImageLabel.ZIndex = 100\n                end\n                if Icon.ImageLabel then''', '''                if Icon.ImageLabel then\n                    Icon.ImageLabel.ZIndex = 100''', 1)

          old = '''            Button.TextButton.AutomaticSize = Enum.AutomaticSize.XY\n            Button.TextButton.Size = UDim2.new(0, 0, 0, 44 - (4 * 2))\n            Button.TextButton.UIPadding.PaddingLeft = UDim.new(0, 7 + 4)\n            Button.TextButton.UIPadding.PaddingRight = UDim.new(0, 7 + 4)\n\n            if Icon then\n                Icon.Size = UDim2.new(0, 22, 0, 22)\n                Icon.AnchorPoint = Vector2.new(0, 0)'''
          new = '''            Button.TextButton.Visible = true\n            Button.TextButton.Active = true\n            Button.TextButton.AutomaticSize = Enum.AutomaticSize.XY\n            Button.TextButton.Size = UDim2.new(0, 0, 0, 44 - (4 * 2))\n            Button.TextButton.UIPadding.PaddingLeft = UDim.new(0, 7 + 4)\n            Button.TextButton.UIPadding.PaddingRight = UDim.new(0, 7 + 4)\n\n            if Icon then\n                Icon.Parent = Button.TextButton\n                Icon.Size = UDim2.new(0, 22, 0, 22)\n                Icon.Position = UDim2.new(0, 0, 0, 0)\n                Icon.AnchorPoint = Vector2.new(0, 0)'''
          assert s.count(old) == 1
          s = s.replace(old, new, 1)

          # After SetIcon recreation, force the icon back out of the layout in icon-only mode.
          old = '''        if Icon and OpenButtonModule.OnlyIcon == true then\n            Icon.Size = UDim2.fromScale(1, 1)'''
          new = '''        if Icon and OpenButtonModule.OnlyIcon == true then\n            Icon.Parent = Button\n            Icon.Size = UDim2.fromScale(1, 1)\n            Icon.ZIndex = 100'''
          assert s.count(old) == 1
          s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')
          PY

          # Syntax sanity check using the project's parser path during the normal build.
          grep -n "UIListLayout.Enabled" src/components/window/Openbutton.lua && exit 1 || true

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/window/Openbutton.lua
          git commit -m "Fix minimized badge image layout and direct dragging"
          git pull --rebase origin main
          git push origin HEAD:main
