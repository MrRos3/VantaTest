name: Vanta polish pass

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/vanta-polish-pass.yml"

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout VantaTest
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Vanta polish
        run: python3 tools/vanta_polish.py

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Setup Lua
        uses: leafo/gh-actions-lua@v11
        with:
          luaVersion: "5.1"

      - name: Setup Aftman
        uses: ok-nick/setup-aftman@v0.3.0

      - name: Install build tools
        run: aftman install

      - name: Build polished runtime
        run: npm run build

      - name: Commit polish and runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git restore package-lock.json 2>/dev/null || true
          git add src main.lua test.lua dist/main.lua build/package.lua
          git commit -m "Vanta visual polish pass [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
