name: Apply badge and Mac fixes

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/apply-badge-mac-fix.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout VantaTest
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply source fixes
        run: python tools/fix_badge_and_mac.py

      - name: Commit source fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/window/Openbutton.lua src/components/window/Init.lua test.lua
          git commit -m "Fix full-bleed badge drag and Mac circles" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
