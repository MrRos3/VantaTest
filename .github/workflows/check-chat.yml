name: Check Vanta Chat LAB

on:
  push:
    branches: [main]
    paths:
      - chat.lua
      - example.lua
      - .github/workflows/check-chat.yml
  pull_request:
    paths:
      - chat.lua
      - example.lua
      - .github/workflows/check-chat.yml

permissions:
  contents: read

jobs:
  chat-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua parser
        uses: leafo/gh-actions-lua@v11
        with:
          luaVersion: '5.1'
      - name: Parse Vanta Chat and example with Lua 5.1
        run: |
          luac -p chat.lua
          luac -p example.lua
      - name: Check native in-window preview and published SaltyIcons assets
        run: |
          grep -q 'VantaChatExperiment' chat.lua
          grep -q 'MessageFeed' chat.lua
          grep -q 'EmojiPicker' chat.lua
          grep -q 'LOCAL DEMO' chat.lua
          grep -q 'rbxassetid://104783825572790' chat.lua
          grep -q 'room=="AR"' chat.lua
          grep -q 'setReply' chat.lua
          grep -q 'local function sendDemo' chat.lua
          grep -q 'MAX_HISTORY = 150' chat.lua
          grep -q 'PULSE UI 0.6' chat.lua
          grep -q 'PulseStudyAccent' chat.lua
          grep -q 'LOCAL ONLY' chat.lua
          grep -q 'JumpToLatest' chat.lua
          grep -q 'Name="Mentions"' chat.lua
          grep -q 'MentionCandidate' chat.lua
          if grep -q 'TextChatService.MessageReceived' chat.lua; then exit 1; fi
          if grep -q 'SendAsync(' chat.lua; then exit 1; fi
          if grep -q 'http.*onrender.com' chat.lua; then exit 1; fi
