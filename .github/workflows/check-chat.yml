name: Check Vanta Roblox Chat
on:
  push:
    branches: [main]
    paths: ['chat.lua', 'example.lua', 'roblox-chat/**', 'tests/*chat*', 'chat.project.json', '.github/workflows/check-chat.yml']
  pull_request:
    paths: ['chat.lua', 'example.lua', 'roblox-chat/**', 'tests/*chat*', 'chat.project.json', '.github/workflows/check-chat.yml']
permissions:
  contents: read
jobs:
  chat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install lupa==2.8
      - run: python -m unittest discover -s tests -p test_chat.py -v
      - name: Reject third-party transport in Roblox chat
        run: |
          python - <<'PY'
          from pathlib import Path
          for file in [Path('chat.lua'), *Path('roblox-chat').glob('*.lua')]:
              text = file.read_text()
              for forbidden in ('onrender.com', 'HttpService', 'MessagingService', 'FireServer(', 'DisplaySystemMessage('):
                  assert forbidden not in text, (file, forbidden)
          PY

