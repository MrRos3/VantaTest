name: One-time VantaUI to VantaTest sync

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/vanta-sync-once.yml"

permissions:
  contents: write

jobs:
  sync:
    if: github.repository == 'MrRos3/VantaTest'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout VantaTest
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Copy VantaUI into VantaTest exactly
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch main https://github.com/MrRos3/VantaUI.git /tmp/vantaui-sync-source
          rsync -a --delete --exclude='/.git/' /tmp/vantaui-sync-source/ ./
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Already identical."
            exit 0
          fi
          git commit -m "Sync VantaTest exactly with VantaUI [skip ci]"
          git push origin HEAD:main
